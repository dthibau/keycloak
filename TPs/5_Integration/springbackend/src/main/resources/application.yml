server:
  port: 8001

spring:
  security:
    oauth2:
      client:
        provider:
          keycloak:
            # Avec issuer-uri, Spring lit .well-known/openid-configuration au démarrage :
            # inutile de déclarer authorization-uri, token-uri, jwk-set-uri, user-info-uri...
            issuer-uri: http://localhost:8080/realms/formation
            user-name-attribute: preferred_username
        registration:
          springapp:
            provider: keycloak
            client-id: springapp
            client-secret: A_REMPLACER_PAR_LE_SECRET_DU_CLIENT_SPRINGAPP
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            scope: openid

logging:
  level:
    '[org.springframework.security]': debug
