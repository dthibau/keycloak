# Fichier de configuration principal (monté dans /opt/keycloak/conf/keycloak.conf)
# Syntaxe : <option-avec-tirets>=<valeur>

# --- Options d'exécution ---
hostname=http://localhost:8080
http-enabled=true
log-level=info

# --- Options de build : leur changement impose un nouveau build ---
health-enabled=true
metrics-enabled=true
