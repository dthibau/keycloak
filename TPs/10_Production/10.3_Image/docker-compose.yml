# Atelier 10.3 – image optimisée
#   https://localhost        : accès public (Nginx)
#   https://admin.localhost  : console d'administration (Nginx)
#   http://localhost:9000    : interface de management
#   http://localhost:81      : pgAdmin
services:
  keycloak-postgresql:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@formation.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "81:80"

  keycloak:
    build: .
    image: keycloak-formation:26.8.0
    # import d'un realm au démarrage : décommenter puis recréer le conteneur
    # command: ["start", "--optimized", "--import-realm"]
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./import:/opt/keycloak/data/import:ro
    ports:
      - "9000:9000"
    depends_on:
      keycloak-postgresql:
        condition: service_healthy

  nginx:
    image: nginx:1.29
    volumes:
      - ../10.2_Production/nginx/keycloak.conf:/etc/nginx/conf.d/default.conf:ro
      - ../10.2_Production/certs:/etc/nginx/certs:ro
    ports:
      - "443:443"
    depends_on:
      - keycloak

volumes:
  pgdata:
