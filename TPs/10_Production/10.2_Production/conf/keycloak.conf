# ===== Base de données =====
# db est une option de build : son changement déclenche un nouveau build
db=postgres
db-url-host=keycloak-postgresql
db-url-database=keycloak
db-username=keycloak
# le mot de passe n'est pas écrit ici : il est lu dans une variable d'environnement
db-password=${DB_PASSWORD}

# ===== TLS : Keycloak expose directement HTTPS =====
https-certificate-file=/opt/keycloak/certs/server.crt
https-certificate-key-file=/opt/keycloak/certs/server.key
http-enabled=false

# ===== Hostname =====
hostname=https://localhost:8443

# ===== Exploitation =====
health-enabled=true
metrics-enabled=true
