# TLS terminé par Nginx, Keycloak joint en HTTP sur le réseau Docker
upstream keycloak {
    server keycloak:8080;
}

# Paramètres communs aux deux serveurs
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
# les réponses de Keycloak contiennent de gros en-têtes (cookies, redirections)
proxy_buffer_size       128k;
proxy_buffers           4 256k;
proxy_busy_buffers_size 256k;

# ----- Accès public : applications et utilisateurs -----
server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # --- étape 3 : décommenter pour restreindre les chemins exposés ---
    # location /admin/         { return 403; }
    # location /realms/master/ { return 403; }

    location / {
        proxy_pass http://keycloak;
    }
}

# ----- Accès administrateurs (réseau interne) -----
server {
    listen 443 ssl;
    server_name admin.localhost;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
        proxy_pass http://keycloak;
    }
}
