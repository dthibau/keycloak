global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  60s
    timeout server  60s

# Résolution DNS de Docker : les nœuds peuvent être recréés (nouvelle IP)
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

frontend stats
    bind *:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /
    stats refresh 5s

# Accès public : applications et utilisateurs
frontend public
    bind *:8080
    option forwardfor
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Port 8080
    default_backend keycloak

# Accès administrateurs (réseau interne)
frontend admin
    bind *:8081
    option forwardfor
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Port 8081
    default_backend keycloak

backend keycloak
    balance roundrobin
    # en cas d'échec de connexion, renvoyer la requête vers un autre nœud
    option redispatch
    retries 2
    # sessions affines : cookie posé par HAProxy
    cookie KC_ROUTE insert indirect nocache
    option httpchk GET /health/ready
    http-check expect status 200
    default-server inter 3s fall 2 rise 2 resolvers docker init-addr last,libc,none
    server kc1 kc1:8080 check port 9000 cookie kc1
    server kc2 kc2:8080 check port 9000 cookie kc2
    server kc3 kc3:8080 check port 9000 cookie kc3
    # nœud ayant traité la requête, visible dans les en-têtes de réponse
    http-response set-header X-Keycloak-Node %s
