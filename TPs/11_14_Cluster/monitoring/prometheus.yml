global:
  scrape_interval: 10s

scrape_configs:
  # Les dashboards Keycloak attendent les labels Kubernetes namespace, container et pod
  - job_name: keycloak-service
    metrics_path: /metrics
    static_configs:
      - targets: ["kc1:9000", "kc2:9000", "kc3:9000"]
        labels:
          namespace: keycloak
          container: keycloak
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: pod
        replacement: "$1"

  - job_name: haproxy
    static_configs:
      - targets: ["haproxy:8404"]
